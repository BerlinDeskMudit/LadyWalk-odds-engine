# Automated dependency updates.
#
# Only ecosystems whose manifest actually exists are listed. Dependabot treats a
# configured ecosystem with no manifest as a hard error, and reports a red run
# every cycle — which is how a green badge turns into noise nobody reads.
#
# To add one: create the manifest, add the block below, and confirm the first
# run succeeds before assuming it is working.
#
# Security updates land in their own PR by default, so an advisory fix is never
# blocked behind an unrelated feature.

version: 2

updates:
  # Keep the Actions runner image current. Node 20 actions are already
  # deprecated on GitHub-hosted runners, and this is how that surfaces early.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - tooling
      - dependencies

